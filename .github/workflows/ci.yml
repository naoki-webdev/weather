name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Generate Prisma Client
        run: npm --prefix server run prisma:generate

      - name: Validate Prisma schema
        run: npm --prefix server run prisma:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/weather_compare_development

      - name: Lint NestJS server
        run: npm --prefix server run lint

      - name: Run NestJS unit tests
        run: npm --prefix server test -- --runInBand

      - name: Build NestJS server
        run: npm --prefix server run build

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform/render-blueprint-check fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=infra/terraform/render-blueprint-check init

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform/render-blueprint-check validate

      - name: Plan Terraform
        run: terraform -chdir=infra/terraform/render-blueprint-check plan
