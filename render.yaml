services:
  - type: web
    name: weather-compare-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_DB_SEED_IF_EMPTY
        value: "true"
      - key: DEMO_USER_EMAIL
        value: demo@example.com
      - key: DEMO_USER_PASSWORD
        value: password
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
